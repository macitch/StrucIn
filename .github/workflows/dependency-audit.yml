name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        platform: [x86_64-unknown-linux-gnu, aarch64-apple-darwin]
    env:
      # Patched PyTorch wheels require macOS 14+ on Apple Silicon.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit tools
        run: python -m pip install --upgrade "pip>=26.2" "uv==0.12.15" "pip-audit==2.10.1"
      - name: Resolve and audit dependencies
        env:
          TARGET_PYTHON: ${{ matrix.python-version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/audit-dependencies.sh "$TARGET_PYTHON" "$TARGET_PLATFORM" "$RUNNER_TEMP/dependency-audit"
      - name: Upload dependency inventories and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.python-version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/dependency-audit/
          if-no-files-found: error
