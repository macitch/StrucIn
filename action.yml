name: "StrucIn Architecture Analysis"
description: "Run structural analysis on your Python repository and post results as a PR comment"

inputs:
  path:
    description: "Path to the Python repository to analyze"
    required: false
    default: "."
  command:
    description: "StrucIn command to run: scan, analyze, or report"
    required: false
    default: "report"
  python-version:
    description: "Python version to use when running StrucIn"
    required: false
    default: "3.12"
  post-comment:
    description: "Post REPORT.md content as a PR comment (true or false)"
    required: false
    default: "true"
  safe-mode:
    description: "Anonymize generated content; does not suppress analysis errors or cycle failures"
    required: false
    default: "false"
  fail-on-cycles:
    description: "Fail if the current analysis contains dependency cycles"
    required: false
    default: "false"

outputs:
  report-path:
    description: "Absolute configured report path; empty when command is not report"
    value: ${{ steps.run-strucin.outputs.report-path }}
  analysis-path:
    description: "Absolute path to the fresh configured analysis JSON"
    value: ${{ steps.run-strucin.outputs.analysis-path }}
  cycle-count:
    description: "Number of cycles in the current analysis"
    value: ${{ steps.run-strucin.outputs.cycle-count }}
  cycles-found:
    description: "Whether dependency cycles were detected: 'true' or 'false'"
    value: ${{ steps.run-strucin.outputs.cycles-found }}

runs:
  using: "composite"
  steps:

    # -------------------------------------------------------------------------
    # 1. Set up the requested Python version
    # -------------------------------------------------------------------------
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # -------------------------------------------------------------------------
    # 2. Install the checked-out Action version
    # -------------------------------------------------------------------------
    - name: Install StrucIn
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$GITHUB_ACTION_PATH"

    # All commands write fresh analysis. The runner checks its in-memory result,
    # so neither missing nor stale JSON can turn a failed check into success.
    - name: Run StrucIn and check dependency cycles
      id: run-strucin
      shell: bash
      env:
        STRUCIN_PATH: ${{ inputs.path }}
        STRUCIN_COMMAND: ${{ inputs.command }}
        STRUCIN_SAFE_MODE: ${{ inputs.safe-mode }}
        STRUCIN_FAIL_ON_CYCLES: ${{ inputs.fail-on-cycles }}
      run: python -I -m strucin.cli.action

    # A strict cycle failure still leaves this run's report available for review.
    - name: Post analysis report as PR comment
      if: >
        always() && !cancelled() &&
        steps.run-strucin.outputs.report-path != '' &&
        inputs.post-comment == 'true' &&
        github.event_name == 'pull_request'
      env:
        STRUCIN_REPORT_PATH: ${{ steps.run-strucin.outputs.report-path }}
        STRUCIN_CYCLES_FOUND: ${{ steps.run-strucin.outputs.cycles-found }}
        STRUCIN_COMMIT: ${{ github.sha }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs   = require('fs');

          const reportPath = process.env.STRUCIN_REPORT_PATH;

          if (!fs.existsSync(reportPath)) {
            core.warning(
              `REPORT.md not found at ${reportPath}. ` +
              `The report generated by this run is no longer available.`
            );
            return;
          }

          const reportContent = fs.readFileSync(reportPath, 'utf8');

          // GitHub comment body cap is 65536 characters. Truncate with a notice
          // if the report exceeds that limit.
          const MAX_CHARS  = 65000;
          const MARKER     = '<!-- strucin-report -->';
          const cyclesFlag = process.env.STRUCIN_CYCLES_FOUND === 'true'
            ? '\n> **Dependency cycles detected.** Review the generated analysis artifact for details.\n'
            : '';

          let body = reportContent;
          if (body.length > MAX_CHARS) {
            body = body.slice(0, MAX_CHARS) +
              '\n\n---\n_Report truncated — full output available in the `REPORT.md` artifact._';
          }

          const commentBody = [
            MARKER,
            '## StrucIn Architecture Analysis',
            cyclesFlag,
            '<details>',
            '<summary>View full report</summary>',
            '',
            body,
            '',
            '</details>',
            '',
            `_Generated by [StrucIn](https://github.com/macitch/StrucIn) on \`${process.env.STRUCIN_COMMIT}\`_`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner:      context.repo.owner,
            repo:       context.repo.repo,
            issue_number: context.issue.number,
          });

          // Update existing comment if one was posted by a previous run,
          // otherwise create a new one.
          const existing = comments.find(c => c.body && c.body.includes(MARKER));

          if (existing) {
            await github.rest.issues.updateComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              comment_id: existing.id,
              body:       commentBody,
            });
            core.info(`Updated existing StrucIn comment (id: ${existing.id})`);
          } else {
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body:         commentBody,
            });
            core.info('Created new StrucIn PR comment.');
          }

    # -------------------------------------------------------------------------
    # Upload only the report generated by this run, including strict failures.
    # -------------------------------------------------------------------------
    - name: Upload REPORT.md artifact
      if: always() && !cancelled() && steps.run-strucin.outputs.report-path != ''
      uses: actions/upload-artifact@v4
      with:
        name: strucin-report
        path: ${{ steps.run-strucin.outputs.report-path }}
        if-no-files-found: error
        retention-days: 30
